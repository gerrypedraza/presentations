<svg width="800" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="t">What a Formula tag should contain</title>
  <desc id="d">A Formula tag branches to two acceptable contents: nested MathML tags, or alt text in the tag properties.</desc>
  <rect width="800" height="560" fill="#ffffff"/>
  <rect x="240" y="40" width="320" height="110" rx="18" fill="#500000"/>
  <text x="400" y="110" font-family="Consolas, 'Courier New', monospace" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;Formula&gt;</text>
  <path d="M400,150 V230 M180,230 H620 M180,230 V300 M620,230 V300" fill="none" stroke="#732f2f" stroke-width="6"/>
  <rect x="30" y="300" width="300" height="170" rx="18" fill="#f2f0ea" stroke="#500000" stroke-width="5"/>
  <text x="180" y="375" font-size="36" font-weight="700" fill="#500000" text-anchor="middle">Nested</text>
  <text x="180" y="420" font-size="36" font-weight="700" fill="#500000" text-anchor="middle">MathML tags</text>
  <text x="400" y="395" font-size="32" font-style="italic" fill="#3e3e3e" text-anchor="middle">or</text>
  <rect x="470" y="300" width="300" height="170" rx="18" fill="#f2f0ea" stroke="#500000" stroke-width="5"/>
  <text x="620" y="375" font-size="36" font-weight="700" fill="#500000" text-anchor="middle">Alt text in</text>
  <text x="620" y="420" font-size="36" font-weight="700" fill="#500000" text-anchor="middle">tag properties</text>
</svg>
